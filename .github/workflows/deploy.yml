name: Deploy GitHub Pages

# Publica o frontend (client-only) no GitHub Pages.
# Pré-requisito: em Settings → Pages, defina "Source: GitHub Actions".

on:
  push:
    branches: [claude/serene-fermat-3ktmv3, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes; deixa o último terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build do frontend
        run: npm run build --workspace=@simulacra/client

      - uses: actions/configure-pages@v5
        with:
          # Tenta habilitar o Pages automaticamente (evita o passo manual).
          # Se a org/permissões bloquearem, habilite em Settings → Pages → Source: GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
